services:
  # ==================== DATABASES ====================
  # Optional local Postgres. Default stack uses Supabase via spot-backend/.env.
  # Local only: docker compose --profile local-db up -d postgres
  postgres:
    profiles: ["local-db"]
    image: postgres:15-alpine
    container_name: spot-postgres
    environment:
      POSTGRES_USER: spot_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: spot_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spot_user -d spot_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spot-network

  redis:
    image: redis:7-alpine
    container_name: spot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spot-network

  # ==================== BACKEND API ====================
  # DB_* come from spot-backend/.env (Supabase pooler). Redis overridden for Docker DNS.
  backend:
    build:
      context: ./spot-backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: development
    container_name: spot-backend
    env_file:
      - ./spot-backend/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      RECOMMENDATION_SERVICE_URL: http://recommendation:5001
      NOSHOW_SERVICE_URL: http://noshow:5002
      NLP_SERVICE_URL: http://nlp:5003
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./spot-backend/src:/app/src
      - ./spot-backend/tests:/app/tests
      - ./spot-backend/migrations:/app/migrations
      - ./spot-backend/scripts:/app/scripts
      - ./spot-backend/.env:/app/.env:ro
    command: npm run dev
    networks:
      - spot-network
    restart: unless-stopped

  # ==================== FRONTEND WEB ====================
  frontend-web:
    build:
      context: ./spot-frontend-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: spot-frontend-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_ENV: development
    ports:
      - "3001:3000"
    depends_on:
      - backend
    volumes:
      - ./spot-frontend-web/src:/app/src
      - ./spot-frontend-web/public:/app/public
    command: npm run dev
    networks:
      - spot-network
    restart: unless-stopped

  # ==================== ADMIN CONSOLE ====================
  admin-console:
    build:
      context: ./spot-admin-console
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: spot-admin
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_ENV: development
    ports:
      - "3002:5173"
    depends_on:
      - backend
    volumes:
      - ./spot-admin-console/src:/app/src
      - ./spot-admin-console/public:/app/public
    command: npm run dev
    networks:
      - spot-network
    restart: unless-stopped

  # ==================== AI SERVICES ====================
  recommendation:
    build:
      context: ./spot-ai-services/recommendation
      dockerfile: Dockerfile
    container_name: spot-recommendation
    env_file:
      - ./spot-backend/.env
    environment:
      PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ./spot-ai-services/recommendation:/app
    networks:
      - spot-network
    restart: unless-stopped

  nlp:
    build:
      context: ./spot-ai-services/nlp-assistant
      dockerfile: Dockerfile
    container_name: spot-nlp
    environment:
      PORT: 5003
      BACKEND_URL: http://backend:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-your-key}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-change-me}
      # gemini-2.5-flash is noticeably slower than the now-retired
      # gemini-1.5-flash this was originally tuned for (~5s for a trivial
      # reply) — 4s was cutting it off mid-response. spot-backend's own
      # REQUEST_TIMEOUT_MS is 20s so it never cuts this off first.
      LLM_TIMEOUT_SECONDS: 15
    ports:
      - "5003:5003"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./spot-ai-services/nlp-assistant:/app
    networks:
      - spot-network
    restart: unless-stopped

networks:
  spot-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
